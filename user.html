<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <img src=" " alt="Catering Logo" class="logo">
            <nav class="navbar">
                <a href="main.html">Home</a>
                <a href="user.html">Menu</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="menu" class="menu">
            <h1>Menu</h1>
            <p>Explore our selection of traditional Indian dishes.</p>
            <div class="dishcard">
                <img src=" " alt="Dish 1">
                <div class="dish-info">
                    <p class="name">Butter Chicken</p>
                    <p class="price">₹150</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
            <div class="dishcard">
                <img src=" " alt="Dish 2">
                <div class="dish-info">
                    <p class="name">Paneer Tikka</p>
                    <p class="price">₹189 </p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
            <!-- Additional dishes needed -->
        </section>

        <section id="cart" class="cart">
            <h1>My Cart</h1>
            <p>Your cart is currently empty.</p>
            <!-- Cart items will be dynamically added here -->
        </section>

        <section id="orders" class="orders">
            <h1>My Orders</h1>
            <p>No orders yet.</p>
            <!-- Order history will be displayed here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2024 TraditionFeast. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
